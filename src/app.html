<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Restore the palette before the first paint to avoid a dark flash in light mode.
			try {
				const savedTheme = localStorage.getItem('kai-portfolio-theme');
				if (savedTheme === 'light' || savedTheme === 'dark')
					document.documentElement.dataset.theme = savedTheme;
			} catch {
				// Graphite remains the default if storage is unavailable.
			}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta property="og:title" content="Kai Yu — Robotics & Machine Learning" />
		<meta
			property="og:description"
			content="Research and projects in mobile robotics, perception, control, and generative machine learning at the University of Pennsylvania."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://www.kaifany.com" />
		%sveltekit.head%
	</head>
	<body class="custom-body" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
